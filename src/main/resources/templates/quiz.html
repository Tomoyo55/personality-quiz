<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16タイプ暗記クイズ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: sans-serif;
            background: linear-gradient(135deg, #e8e7ff, #dff5ff);
            color: #343452;
        }

        header {
            padding: 22px;
            text-align: center;
            background: white;
            box-shadow: 0 3px 12px #33333310;
        }

        header h1 {
            margin: 0;
            color: #7565d8;
            font-size: 25px;
        }

        .container {
            width: min(720px, 92%);
            margin: 35px auto;
        }

        .progress-area {
            margin-bottom: 18px;
            font-weight: bold;
        }

        .progress-track {
            height: 10px;
            margin-top: 10px;
            overflow: hidden;
            background: #ffffffaa;
            border-radius: 20px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #8e7cf3, #58c9e8);
            border-radius: 20px;
        }

        .card {
            padding: 30px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 35px #5e5b9918;
        }

        .tag {
            display: inline-block;
            padding: 7px 13px;
            color: #6d5bd0;
            background: #f0edff;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        h2 {
            margin: 22px 0;
            line-height: 1.6;
            font-size: 23px;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .choice {
            width: 100%;
            min-height: 58px;
            padding: 14px;
            border: 2px solid #e7e5f5;
            border-radius: 14px;
            background: white;
            color: #343452;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .choice:hover:not(:disabled) {
            border-color: #8e7cf3;
            background: #f8f6ff;
            transform: translateY(-2px);
        }

        .choice:disabled {
            cursor: default;
        }

        .choice.correct {
            border-color: #36b987;
            background: #e7fbf2;
            color: #167653;
        }

        .choice.incorrect {
            border-color: #ef7777;
            background: #fff0f0;
            color: #b63c49;
        }

        .feedback {
            margin-top: 22px;
            padding: 20px;
            border-radius: 16px;
        }

        .feedback.correct {
            background: #e7fbf2;
            border: 1px solid #b4efd5;
        }

        .feedback.incorrect {
            background: #fff0f0;
            border: 1px solid #ffcaca;
        }

        .feedback h3 {
            margin: 0 0 12px;
            font-size: 20px;
        }

        .feedback p {
            line-height: 1.8;
            margin-bottom: 0;
        }

        .next-button {
            display: block;
            width: 100%;
            margin-top: 22px;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #8270eb, #a17be8);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .next-button:hover {
            filter: brightness(1.05);
        }

        .score {
            margin-top: 18px;
            text-align: center;
            color: #77758e;
            font-size: 14px;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 520px) {
            .card {
                padding: 20px;
            }

            .choices {
                grid-template-columns: 1fr;
            }

            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🌈 16タイプ暗記クイズ</h1>
</header>

<main class="container">

    <div class="progress-area">
        <span id="questionNumber"
              th:text="'問題 ' + (${index} + 1) + ' / ' + ${total}">
            問題 1 / 16
        </span>

        <div class="progress-track">
            <div class="progress-bar"
                 id="progressBar"
                 style="width: 33.3%">
            </div>
        </div>
    </div>

    <section class="card">

        <span class="tag">💡 4タイプを覚えよう</span>

        <h2 id="questionText"
            th:text="${question.question}">
            問題文
        </h2>

        <div class="choices" id="choices">
            <button class="choice"
                    th:each="choice : ${question.choices}"
                    type="button"
                    th:text="${choice}"
                    th:attr="data-answer=${choice}"
                    onclick="checkAnswer(this)">
                選択肢
            </button>
        </div>

        <section id="feedback" class="feedback" hidden>
            <h3 id="feedbackTitle"></h3>
            <p id="correctAnswer"></p>
            <p id="explanation"></p>
        </section>

        <button id="nextButton"
                class="next-button"
                type="button"
                onclick="nextQuestion()"
                hidden>
            次の問題へ →
        </button>

        <div class="score">
            正解数：<span id="score" th:text="${score}">0</span>
        </div>

    </section>

</main>

<script th:inline="javascript">
    const answer = /*[[${question.answer}]]*/ "";
    const explanationText = /*[[${question.explanation}]]*/ "";
    const currentIndex = /*[[${index}]]*/ 0;
    const totalQuestions = /*[[${total}]]*/ 16;
    const progressPercent = ((currentIndex + 1) / totalQuestions) * 100;
    document.getElementById("progressBar").style.width = progressPercent + "%";
    const currentScore = /*[[${score}]]*/ 0;

    let answered = false;
    let score = currentScore;

    function checkAnswer(button) {
        if (answered) return;

        answered = true;

        const selected = button.dataset.answer;
        const isCorrect = selected === answer;

        if (isCorrect) {
            score++;
            button.classList.add("correct");
        } else {
            button.classList.add("incorrect");

            document.querySelectorAll(".choice").forEach(choice => {
                if (choice.dataset.answer === answer) {
                    choice.classList.add("correct");
                }
            });
        }

        document.querySelectorAll(".choice").forEach(choice => {
            choice.disabled = true;
        });

        const feedback = document.getElementById("feedback");
        feedback.hidden = false;
        feedback.classList.add(isCorrect ? "correct" : "incorrect");

        document.getElementById("feedbackTitle").textContent =
            isCorrect ? "🎉 正解！" : "💭 不正解…";

        document.getElementById("correctAnswer").textContent =
            "正解：" + answer;

        document.getElementById("explanation").textContent =
            "📖 解説：" + explanationText;

        document.getElementById("score").textContent = score;

        // 回答をサーバーに記録（間違えた問題の管理用）
        fetch("/quiz/answer?correct=" + isCorrect, { method: "POST" });

        const nextButton = document.getElementById("nextButton");
        nextButton.hidden = false;

        nextButton.textContent =
            currentIndex + 1 >= totalQuestions
                ? "結果を見る →"
                : "次の問題へ →";
    }

    function nextQuestion() {
        location.href = "/quiz/next";
    }
</script>

</body>
</html>
